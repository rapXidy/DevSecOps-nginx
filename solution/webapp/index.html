<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to NGINX!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Changed from height: 100vh to min-height: 100vh to allow footer space */
            overflow-x: hidden;
            /* Changed from overflow: hidden to overflow-x: hidden to allow vertical scrolling if needed */
            position: relative;
        }

        /* Main container with padding at bottom to prevent content from touching footer */
        .main-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            width: 100%;
            padding-bottom: 60px;
            /* Space for fixed footer */
            box-sizing: border-box;
        }

        .container {
            text-align: center;
            background-color: #ffffff;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin: 20px;
            /* Added margin for better spacing on small screens */
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #4CAF50;
        }

        p {
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 1em;
            color: #ffffff;
            background-color: #4CAF50;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #45a049;
        }

        /* Footer Styles */
        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            padding: 15px 0;
            font-size: 0.9rem;
            font-family: 'Arial', sans-serif;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            /* Ensure footer stays above other content */
        }

        .footer p {
            margin: 0;
            padding: 0;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 768px) {
            .container {
                padding: 30px;
                margin: 15px;
            }

            h1 {
                font-size: 1.8em;
            }

            p {
                font-size: 1em;
            }

            .footer {
                padding: 12px 0;
                font-size: 0.8rem;
            }
        }

        /* For very tall screens, ensure content doesn't get hidden behind footer */
        @media (max-height: 500px) {
            .main-wrapper {
                padding-bottom: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="container">
            <h1>Welcome to NGINX!</h1>
            <p>Congratulations! Your NGINX web server is up and running.</p>
            <a href="#" class="btn">Learn More</a>
        </div>
    </div>

    <!-- Footer Section -->
    <footer class="footer">
    <p>&copy; 2026 by Chidii</p>
    </footer>
</body>
</html>
